<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>bouquetsbysha</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      font-family: 'Fredoka', sans-serif;
      background-color: #C379D5;
    }

    body {
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Micro-grid texture */
    .texture-overlay {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
      background-size: 4px 4px;
      z-index: 1;
      pointer-events: none;
    }

    /* Sparkle canvas */
    #sparkleCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .frame {
      position: relative;
      z-index: 3;
      max-width: 580px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border: 3.5px solid #F0ABFC;
      border-radius: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 48px 32px;
      box-shadow: 0 16px 40px -8px rgba(100, 20, 110, 0.35);
    }

    h1 {
      font-size: clamp(38px, 6vw, 62px);
      font-weight: 700;
      color: #C34FD3;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      text-shadow: 
        -2.5px -2.5px 0 #5A166A,
         2.5px -2.5px 0 #5A166A,
        -2.5px  2.5px 0 #5A166A,
         2.5px  2.5px 0 #5A166A,
         0px    4px   0 #5A166A;
    }

    p {
      color: #6B5B73;
      font-size: 16px;
      line-height: 1.6;
      max-width: 440px;
      font-weight: 600;
      margin-bottom: 28px;
    }

    .kofi-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #C34FD3;
      color: #FFFFFF;
      font-family: 'Fredoka', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      padding: 14px 28px;
      border-radius: 9999px;
      border: 2px solid #5A166A;
      box-shadow: 0 4px 14px rgba(195, 79, 211, 0.35);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .kofi-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(195, 79, 211, 0.45);
    }

    .kofi-btn:active {
      transform: translateY(0);
    }

    .cup-icon {
      width: 20px;
      height: 20px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="texture-overlay"></div>
  <canvas id="sparkleCanvas"></canvas>

  <div class="frame">
    <h1>coming soon..</h1>
    <p>
      the developer is actively working on the storefront. you can fuel her work with a coffee! :)
    </p>

    <a href="https://ko-fi.com/moriqrr" target="_blank" rel="noopener noreferrer" class="kofi-btn">
      <svg class="cup-icon" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 3H4v10c0 2.21 1.79 4 4 4h6c2.21 0 4-1.79 4-4v-3h2c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 5h-2V5h2v3zM2 19h18v2H2v-2z"/>
      </svg>
      <span>Support on Ko-fi</span>
    </a>
  </div>

  <script>
    const canvas = document.getElementById('sparkleCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const flares = Array.from({ length: 32 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      driftY: 0.15 + Math.random() * 0.25,
      driftX: (Math.random() - 0.5) * 0.1,
      phase: Math.random() * Math.PI * 2,
      phaseSpeed: 0.025 + Math.random() * 0.03,
      baseSpan: 16 + Math.random() * 10
    }));

    const glitters = Array.from({ length: 65 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      driftY: 0.2 + Math.random() * 0.3,
      driftX: (Math.random() - 0.5) * 0.15,
      size: Math.random() < 0.3 ? 2 : 1,
      phase: Math.random() * Math.PI * 2,
      phaseSpeed: 0.04 + Math.random() * 0.05
    }));

    function drawGlowFlare(x, y, span, intensity) {
      if (intensity <= 0) return;

      ctx.save();
      ctx.translate(x, y);

      const auraRad = span * 0.65;
      const auraGrad = ctx.createRadialGradient(0, 0, 0, 0, 0, auraRad);
      auraGrad.addColorStop(0, `rgba(255, 175, 130, ${0.45 * intensity})`);
      auraGrad.addColorStop(0.5, `rgba(255, 140, 100, ${0.2 * intensity})`);
      auraGrad.addColorStop(1, 'rgba(255, 140, 100, 0)');
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(0, 0, auraRad, 0, Math.PI * 2);
      ctx.fill();

      const horizGrad = ctx.createLinearGradient(-span, 0, span, 0);
      horizGrad.addColorStop(0, 'rgba(255, 185, 140, 0)');
      horizGrad.addColorStop(0.5, `rgba(255, 205, 170, ${0.85 * intensity})`);
      horizGrad.addColorStop(1, 'rgba(255, 185, 140, 0)');
      ctx.fillStyle = horizGrad;
      ctx.fillRect(-span, -1.2, span * 2, 2.4);

      const vertGrad = ctx.createLinearGradient(0, -span, 0, span);
      vertGrad.addColorStop(0, 'rgba(255, 185, 140, 0)');
      vertGrad.addColorStop(0.5, `rgba(255, 205, 170, ${0.85 * intensity})`);
      vertGrad.addColorStop(1, 'rgba(255, 185, 140, 0)');
      ctx.fillStyle = vertGrad;
      ctx.fillRect(-1.2, -span, 2.4, span * 2);

      const coreSize = 2.5 * intensity;
      ctx.fillStyle = `rgba(255, 255, 255, ${0.95 * intensity})`;
      ctx.fillRect(-coreSize / 2, -coreSize / 2, coreSize, coreSize);

      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let f of flares) {
        f.y -= f.driftY;
        f.x += f.driftX;
        f.phase += f.phaseSpeed;

        if (f.y < -30) {
          f.y = canvas.height + 30;
          f.x = Math.random() * canvas.width;
        }

        const intensity = (Math.sin(f.phase) + 1) / 2;
        drawGlowFlare(f.x, f.y, f.baseSpan, intensity);
      }

      for (let g of glitters) {
        g.y -= g.driftY;
        g.x += g.driftX;
        g.phase += g.phaseSpeed;

        if (g.y < -10) {
          g.y = canvas.height + 10;
          g.x = Math.random() * canvas.width;
        }

        const alpha = (Math.sin(g.phase) + 1) / 2;
        if (alpha > 0.15) {
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha * 0.9})`;
          ctx.fillRect(Math.floor(g.x), Math.floor(g.y), g.size, g.size);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
